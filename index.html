<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline POS System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Dexie.js for local database -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Prevent UI flashing before Alpine loads -->
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 h-screen overflow-auto" x-data="posApp()" x-init="initApp()">

    <!-- ==========================================
         VIEW 1: POS REGISTER 
         ========================================== -->
    <div x-cloak x-show="currentView === 'pos'" class="flex flex-col md:flex-row h-full w-full">
        
        <!-- Left Side: Product Grid -->
        <div class="flex-1 flex flex-col h-full bg-gray-50">
            <!-- Top Bar -->
            <div class="bg-white p-4 shadow-sm flex flex-col md:flex-row md:items-center justify-between border-b gap-4">
                <div class="flex flex-col sm:flex-row sm:items-center gap-3">
                    <h1 class="text-2xl font-bold text-gray-800">Register</h1>
                    <button @click="switchView('admin')" class="px-4 py-2 bg-gray-800 text-white font-semibold rounded-lg hover:bg-gray-700 transition flex items-center shadow-sm">
                        ⚙️ Admin Panel
                    </button>
                </div>
                
                <div class="flex space-x-2 overflow-x-auto pb-1">
                    <button @click="activeCategory = 'All'" 
                            :class="activeCategory === 'All' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'"
                            class="px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition">
                        All
                    </button>
                    <template x-for="cat in categories" :key="cat.name">
                        <button @click="activeCategory = cat.name" 
                                :class="activeCategory === cat.name ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'"
                                class="px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition"
                                x-text="cat.name">
                        </button>
                    </template>
                </div>
            </div>

            <!-- Product Cards -->
            <div class="p-6 flex-1 overflow-y-auto">
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                    <template x-for="product in filteredProducts" :key="product.id">
                        <div @click="addToCart(product)" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden cursor-pointer hover:shadow-md hover:border-blue-300 transition transform hover:-translate-y-1 flex flex-col">
                            <div class="h-32 bg-gray-100 w-full flex-shrink-0 relative">
                                <template x-if="product.image">
                                    <img :src="product.image" class="w-full h-full object-cover">
                                </template>
                                <template x-if="!product.image">
                                    <div class="w-full h-full flex items-center justify-center text-gray-400">
                                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    </div>
                                </template>
                            </div>
                            <div class="p-3 flex flex-col flex-1 justify-between">
                                <h3 class="text-sm font-bold text-gray-800 leading-tight mb-1" x-text="product.name"></h3>
                                <p class="text-blue-600 font-bold" x-text="'₱' + product.price.toFixed(2)"></p>
                            </div>
                        </div>
                    </template>
                    <div x-show="filteredProducts.length === 0" class="col-span-full py-12 text-center text-gray-500">
                        No products found. Switch to the Admin Panel to add some!
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Cart -->
        <div class="w-full md:w-96 bg-white shadow-xl flex flex-col h-full border-t border-gray-200 md:border-t-0 md:border-l z-10">
            <div class="p-4 bg-gray-50 border-b border-gray-200">
                <h2 class="text-xl font-bold text-gray-800">Current Order</h2>
                <p class="text-xs text-gray-500 mt-1" x-text="'Ticket: #' + Math.floor(Math.random() * 10000).toString().padStart(4, '0')"></p>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                <template x-for="(item, index) in cart" :key="index">
                    <div class="flex justify-between items-center group">
                        <div class="flex-1">
                            <h4 class="text-sm font-semibold text-gray-800" x-text="item.name"></h4>
                            <p class="text-xs text-gray-500" x-text="'₱' + item.price.toFixed(2)"></p>
                        </div>
                        <div class="flex items-center space-x-2 bg-gray-100 rounded-lg p-1">
                            <button @click="decreaseQty(index)" class="w-6 h-6 flex items-center justify-center bg-white rounded text-red-500 font-bold hover:bg-gray-50 shadow-sm">-</button>
                            <span class="text-sm font-bold w-4 text-center" x-text="item.quantity"></span>
                            <button @click="increaseQty(index)" class="w-6 h-6 flex items-center justify-center bg-white rounded text-blue-500 font-bold hover:bg-gray-50 shadow-sm">+</button>
                        </div>
                        <div class="w-16 text-right ml-2">
                            <p class="text-sm font-bold text-gray-900" x-text="'₱' + (item.price * item.quantity).toFixed(2)"></p>
                        </div>
                    </div>
                </template>
                <div x-show="cart.length === 0" class="text-center py-8 text-gray-400 text-sm">
                    Tap items to add to order
                </div>
            </div>

            <div class="p-4 bg-gray-50 border-t border-gray-200">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-gray-600">Subtotal</span>
                    <span class="font-semibold text-gray-800" x-text="'₱' + cartTotal.toFixed(2)"></span>
                </div>
                <div class="flex justify-between items-center mb-6 pt-2 border-t border-gray-300">
                    <span class="text-lg font-bold text-gray-900">Total</span>
                    <span class="text-2xl font-bold text-blue-600" x-text="'₱' + cartTotal.toFixed(2)"></span>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Customer Payment</label>
                    <input type="number" x-model.number="customerMoney" step="0.01" min="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Enter amount paid">
                </div>

                <div x-show="customerMoney > 0" class="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-medium text-green-800">Change:</span>
                        <span class="text-lg font-bold text-green-600" x-text="'₱' + change.toFixed(2)"></span>
                    </div>
                </div>

                <div class="flex space-x-2">
                    <button @click="clearCart()" class="px-4 py-3 bg-red-100 text-red-600 font-bold rounded-lg hover:bg-red-200 transition">Clear</button>
                    <button @click="checkout()" class="flex-1 bg-green-500 text-white font-bold text-lg py-3 rounded-lg hover:bg-green-600 shadow-md transition disabled:opacity-50" :disabled="cart.length === 0">Charge</button>
                </div>
            </div>
        </div>
    </div>


    <!-- ==========================================
         VIEW 2: ADMIN INVENTORY 
         ========================================== -->
    <div x-cloak x-show="currentView === 'admin'" class="h-full w-full overflow-y-auto bg-gray-100 p-8">
        
        <div class="max-w-6xl mx-auto">
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-3xl font-bold text-gray-900">Inventory Management</h1>
                <button @click="switchView('pos')" class="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition shadow-sm">
                    ⬅️ Back to Register
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                
                <!-- Add/Edit Form -->
                <div class="bg-white p-6 rounded-lg shadow-md h-fit">
                    <h2 class="text-xl font-semibold mb-4" x-text="isEditing ? 'Edit Product' : 'Add New Product'"></h2>
                    <form @submit.prevent="saveProduct" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Product Image</label>
                            <input type="file" accept="image/*" @change="handleImageUpload" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                            <template x-if="formData.image">
                                <div class="mt-3 relative inline-block">
                                    <img :src="formData.image" class="h-24 w-24 object-cover rounded-md border border-gray-200 shadow-sm">
                                    <button type="button" @click="formData.image = null" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 w-6 h-6 flex items-center justify-center text-xs hover:bg-red-600">&times;</button>
                                </div>
                            </template>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Product Name</label>
                            <input type="text" x-model="formData.name" required placeholder="e.g., Wintermelon Milk Tea" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Category</label>
                            <div class="flex mt-1 space-x-2">
                                <select x-model="formData.category" required class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500">
                                    <option value="" disabled>Select a category</option>
                                    <template x-for="cat in categories" :key="cat.id">
                                        <option :value="cat.name" x-text="cat.name"></option>
                                    </template>
                                </select>
                                <button type="button" @click="addNewCategory()" class="bg-gray-200 text-gray-700 px-3 py-2 rounded-md hover:bg-gray-300 font-bold" title="Add New Category">+</button>
                            </div>
                            <div class="mt-3 grid grid-cols-2 gap-2">
                                <template x-for="cat in categories" :key="cat.id">
                                    <div class="flex items-center justify-between rounded-full bg-gray-100 px-3 py-2 text-sm text-gray-700">
                                        <span x-text="cat.name"></span>
                                        <button type="button" @click="deleteCategory(cat.id)" class="ml-2 text-gray-400 hover:text-red-600 font-bold">×</button>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Price (₱)</label>
                            <input type="number" step="0.01" x-model="formData.price" required placeholder="0.00" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500">
                        </div>
                        <div class="flex space-x-3 pt-4">
                            <button type="submit" class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 font-medium transition" x-text="isEditing ? 'Update Item' : 'Save Item'"></button>
                            <button type="button" x-show="isEditing" @click="resetForm()" class="flex-1 bg-gray-200 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-300 font-medium transition">Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- Product List Table -->
                <div class="md:col-span-2 bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-xl font-semibold mb-4">Current Menu</h2>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Image</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Category</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Price</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <template x-for="product in products" :key="product.id">
                                    <tr class="hover:bg-gray-50 transition">
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <template x-if="product.image"><img :src="product.image" class="h-10 w-10 object-cover rounded-md border"></template>
                                            <template x-if="!product.image"><div class="h-10 w-10 bg-gray-100 rounded-md border flex items-center justify-center text-gray-400 text-xs">No img</div></template>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" x-text="product.name"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800" x-text="product.category"></span></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-semibold" x-text="'₱' + product.price.toFixed(2)"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                            <button @click="editProduct(product)" class="text-indigo-600 hover:text-indigo-900 mr-4">Edit</button>
                                            <button @click="deleteProduct(product.id)" class="text-red-600 hover:text-red-900">Delete</button>
                                        </td>
                                    </tr>
                                </template>
                                <tr x-show="products.length === 0">
                                    <td colspan="5" class="px-6 py-8 text-center text-gray-500">No products found. Add some items!</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
         UNIFIED APP LOGIC 
         ========================================== -->
    <script>
        // Global Database Setup
        const db = new Dexie("POS_LocalDB");
        db.version(2).stores({
            products: '++id, name, category, price', 
            categories: '++id, name' 
        });

        function posApp() {
            return {
                // --- STATE MANAGEMENT ---
                currentView: 'pos', // 'pos' or 'admin'
                products: [],
                categories: [],
                
                // --- ADMIN STATE ---
                formData: { id: null, name: '', category: '', price: '', image: null },
                isEditing: false,

                // --- POS STATE ---
                cart: [],
                activeCategory: 'All',
                customerMoney: 0,

                // --- INITIALIZATION ---
                async initApp() {
                    const catCount = await db.categories.count();
                    if (catCount === 0) {
                        await db.categories.bulkAdd([
                            { name: 'Burgers' }, { name: 'Drinks' }, { name: 'Sides' }
                        ]);
                    }
                    this.loadCategories();
                    this.loadProducts();
                },

                switchView(view) {
                    this.currentView = view;
                    if(view === 'pos') {
                        this.loadProducts(); // Ensure POS has fresh data when returning from Admin
                    }
                },

                // --- SHARED DATA FETCHING ---
                async loadCategories() {
                    this.categories = await db.categories.orderBy('name').toArray();
                },
                async loadProducts() {
                    this.products = await db.products.reverse().toArray();
                },

                // --- ADMIN FUNCTIONS ---
                handleImageUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => { this.formData.image = e.target.result; };
                    reader.readAsDataURL(file);
                },

                async addNewCategory() {
                    const newCat = prompt("Enter the name of the new category:");
                    if (newCat && newCat.trim() !== '') {
                        const trimmedName = newCat.trim();
                        await db.categories.add({ name: trimmedName });
                        await this.loadCategories(); 
                        this.formData.category = trimmedName; 
                    }
                },

                async deleteCategory(id) {
                    const categoryToRemove = this.categories.find(cat => cat.id === id);
                    if (!categoryToRemove) return;
                    if (!confirm(`Delete category '${categoryToRemove.name}'?`)) return;
                    await db.categories.delete(id);
                    await this.loadCategories();
                },

                async saveProduct() {
                    const priceAsNumber = parseFloat(this.formData.price);
                    if (this.isEditing) {
                        await db.products.update(this.formData.id, {
                            name: this.formData.name, category: this.formData.category, 
                            price: priceAsNumber, image: this.formData.image
                        });
                    } else {
                        await db.products.add({
                            name: this.formData.name, category: this.formData.category, 
                            price: priceAsNumber, image: this.formData.image
                        });
                    }
                    this.resetForm();
                    this.loadProducts();
                },

                editProduct(product) {
                    this.formData = { ...product }; 
                    this.isEditing = true;
                },

                async deleteProduct(id) {
                    if (confirm('Are you sure you want to delete this item?')) {
                        await db.products.delete(id);
                        this.loadProducts();
                    }
                },

                resetForm() {
                    this.formData = { id: null, name: '', category: '', price: '', image: null };
                    this.isEditing = false;
                    const fileInput = document.querySelector('input[type="file"]');
                    if(fileInput) fileInput.value = '';
                },

                // --- POS REGISTER FUNCTIONS ---
                get filteredProducts() {
                    if (this.activeCategory === 'All') return this.products;
                    return this.products.filter(p => p.category === this.activeCategory);
                },

                get cartTotal() {
                    return this.cart.reduce((total, item) => total + (item.price * item.quantity), 0);
                },

                get change() {
                    return Math.max(0, this.customerMoney - this.cartTotal);
                },

                addToCart(product) {
                    const existingItemIndex = this.cart.findIndex(item => item.id === product.id);
                    if (existingItemIndex > -1) {
                        this.cart[existingItemIndex].quantity += 1;
                    } else {
                        this.cart.push({ id: product.id, name: product.name, price: product.price, quantity: 1 });
                    }
                },

                increaseQty(index) { this.cart[index].quantity += 1; },
                decreaseQty(index) {
                    if (this.cart[index].quantity > 1) { this.cart[index].quantity -= 1; } 
                    else { this.cart.splice(index, 1); }
                },

                clearCart() {
                    if(confirm("Clear current order?")) {
                        this.cart = [];
                        this.customerMoney = 0;
                    }
                },

                checkout() {
                    if(this.cart.length === 0) return;
                    if(this.customerMoney < this.cartTotal) {
                        alert('Insufficient payment amount!');
                        return;
                    }
                    this.printReceipt();
                    this.cart = [];
                    this.customerMoney = 0;
                },

                printReceipt() {
                    const receiptWindow = window.open('', '_blank', 'width=400,height=600');
                    const now = new Date();
                    let receiptHTML = `
                        <html>
                        <head>
                            <title>Receipt</title>
                            <style>
                                body { font-family: 'Courier New', monospace; font-size: 12px; margin: 0; padding: 10px; }
                                .center { text-align: center; } .right { text-align: right; } .bold { font-weight: bold; }
                                .receipt-item { margin: 5px 0; } .line { border-top: 1px dashed #000; margin: 10px 0; }
                            </style>
                        </head>
                        <body>
                            <div class="center bold">
                                <h2>POS RECEIPT</h2>
                                <p>${now.toLocaleDateString()} ${now.toLocaleTimeString()}</p>
                            </div>
                            <div class="line"></div>`;
                    
                    this.cart.forEach(item => {
                        const subtotal = item.price * item.quantity;
                        receiptHTML += `
                            <div class="receipt-item">
                                <span>${item.name}</span>
                                <span class="right">₱${item.price.toFixed(2)} x ${item.quantity}</span><br>
                                <span class="right bold">₱${subtotal.toFixed(2)}</span>
                            </div>`;
                    });
                    
                    receiptHTML += `
                            <div class="line"></div>
                            <div class="receipt-item bold"><span>TOTAL:</span><span class="right">₱${this.cartTotal.toFixed(2)}</span></div>
                            <div class="receipt-item"><span>CASH:</span><span class="right">₱${this.customerMoney.toFixed(2)}</span></div>
                            <div class="receipt-item"><span>CHANGE:</span><span class="right">₱${this.change.toFixed(2)}</span></div>
                            <div class="line"></div>
                            <div class="center"><p>Thank you!</p></div>
                        </body>
                        </html>`;
                    
                    receiptWindow.document.write(receiptHTML);
                    receiptWindow.document.close();
                    setTimeout(() => {
                        receiptWindow.print();
                        receiptWindow.close();
                    }, 500);
                }
            }
        }
    </script>
</body>
</html>
