<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud POS - Customer Access</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f7fb;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: min(360px, calc(100vw - 32px));
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #dbeafe;
      border-top-color: #355cff;
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="spinner"></div>
    <h1 style="font-size:18px; margin:0 0 6px;">Verifying access</h1>
    <p style="font-size:13px; color:#6b7280; margin:0;">Checking your secure Firebase session.</p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAwloWQC4wzR5z3BIWPqQxoyR-2835jKoQ",
      authDomain: "pos-web-system-6ab41.firebaseapp.com",
      projectId: "pos-web-system-6ab41",
      storageBucket: "pos-web-system-6ab41.firebasestorage.app",
      messagingSenderId: "1074382185012",
      appId: "1:1074382185012:web:c13960df381bb9d52fe061",
      measurementId: "G-PYZMJ2NP6Z"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const authReady = auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    function normalizeRole(role) {
      return String(role || 'customer').trim().toLowerCase();
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.replace('login.html');
        return;
      }

      try {
        await authReady;
        const doc = await db.collection('users').doc(user.uid).get();
        if (!doc.exists) {
          await auth.signOut();
          window.location.replace('login.html');
          return;
        }

        const role = normalizeRole(doc.data().role);
        if (role === 'admin') {
          window.location.replace('admin.html');
        } else if (role === 'customer') {
          window.location.replace('index.html');
        } else {
          await auth.signOut();
          window.location.replace('login.html');
        }
      } catch (error) {
        await auth.signOut();
        window.location.replace('login.html');
      }
    });
  </script>
</body>

</html>
